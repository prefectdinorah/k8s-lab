apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: podinfo
  name: podinfo
  namespace: podinfo
  annotations:
    kubernetes.io/change-cause: "podinfo 6.7.1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
      - image: ghcr.io/stefanprodan/podinfo:6.7.1
        name: podinfo
        ports:
        - containerPort: 9898
          name: http
status: {}
